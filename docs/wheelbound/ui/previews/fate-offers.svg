s or gameplay approval • 2026-10-29</text><text x="235" y="118" font-size="21" fill="#DBB45E">Bossing Fate</text><text x="235" y="153" font-size="14" fill="#E1DDCF">First: show the committed Standard kill count.</text><text x="235" y="178" font-size="14" fill="#E1DDCF">Then: choose a frozen card. The Bossing Wheel chooses the boss after selection.</text><rect x="237" y="225" width="286" height="320" rx="2" fill="#30372F" stroke="#DBB45E"/><text x="256" y="267" font-size="21" fill="#DBB45E">Standard</text><text x="256" y="313" font-size="14" fill="#E1DDCF">Committed target A</text><text x="256" y="338" font-size="14" fill="#E1DDCF">KC: from offer snapshot</text><text x="256" y="363" font-size="14" fill="#E1DDCF">Reward: reviewed quote</text><text x="256" y="388" font-size="14" fill="#E1DDCF"></text><text x="256" y="413" font-size="14" fill="#E1DDCF">No boss selection</text><text x="256" y="438" font-size="14" fill="#E1DDCF">No rerolls</text><rect x="256" y="477" width="247" height="32" rx="2" fill="#383A32" stroke="#707266"/><text x="268" y="498" font-size="13" fill="#DBB45E">Select this card</text><rect x="547" y="225" width="286" height="320" rx="2" fill="#30372F" stroke="#DBB45E"/><text x="566" y="267" font-size="21" fill="#DBB45E">Standard</text><text x="566" y="313" font-size="14" fill="#E1DDCF">Committed target B</text><text x="566" y="338" font-size="14" fill="#E1DDCF">KC: from offer snapshot</text><text x="566" y="363" font-size="14" fill="#E1DDCF">Reward: reviewed quote</text><text x="566" y="388" font-size="14" fill="#E1DDCF"></text><text x="566" y="413" font-size="14" fill="#E1DDCF">No boss selection</text><text x="566" y="438" font-size="14" fill="#E1DDCF">No rerolls</text><rect x="566" y="477" width="247" height="32" rx="2" fill="#383A32" stroke="#707266"/><text x="578" y="498" font-size="13" fill="#DBB45E">Select this card</text><rect x="858" y="225" width="304" height="320" rx="2" fill="#2C302E" stroke="#707266"/><text x="878" y="264" font-size="19" fill="#B9B6A9">Third offering</text><text x="878" y="310" font-size="13" fill="#E1DDCF">Appears after the approved</text><text x="878" y="335" font-size="13" fill="#E1DDCF">capacity upgrade.</text><text x="878" y="360" font-size="13" fill="#E1DDCF"></text><text x="878" y="385" font-size="13" fill="#E1DDCF">Actual eligibility controls</text><text x="878" y="410" font-size="13" fill="#E1DDCF">Lesser / Standard / Greater</text><text x="878" y="435" font-size="13" fill="#E1DDCF">and ranked Challenge offers.</text><text x="237" y="600" font-size="13" fill="#B9B6A9">Challenge cards show rank/rules first. Exact creature and item reveal after committed selection.</text><text x="237" y="633" font-size="13" fill="#B9B6A9">This board illustrates layout only; counts and rewards are not fabricated.</text></g></svg>
