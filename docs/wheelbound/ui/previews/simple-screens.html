<script>
(()=>{const root=document.getElementById('wb-simple-screens');const data=JSON.parse(root.querySelector('#ws-screen-data').textContent);const picker=root.querySelector('.ws-picker');const main=root.querySelector('.ws-main');const count=root.querySelector('.ws-count');const byId=new Map(data.map(s=>[s.id,s]));let current='overview';let stack=[];const selectedRows=new Map();const preferences=new Map();
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function button(text,fn,disabled=false,cls=''){const b=el('button',text,'cursor-interaction '+cls);b.type='button';b.disabled=disabled;if(fn)b.addEventListener('click',fn);return b}
const groups=[...new Set(data.map(s=>s.group))];groups.forEach(name=>{const g=el('optgroup');g.label=name;data.filter(s=>s.group===name).forEach(s=>{const o=el('option',s.title);o.value=s.id;g.appendChild(o)});picker.appendChild(g)});
function navigate(id,remember=true){if(!byId.has(id))return;if(remember&&current!==id){stack.push(current);if(stack.length>20)stack.shift()}current=id;render()}
function render(){const s=byId.get(current);main.replaceChildren();picker.value=s.id;count.textContent=(data.findIndex(v=>v.id===s.id)+1)+' / '+data.length;root.querySelectorAll('.ws-nav [data-route]').forEach(b=>{if(b.dataset.route===s.id)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(stack.length)main.appendChild(button('Back',()=>{const prev=stack.pop();navigate(prev,false)},false,'ws-back'));
const content=el('div',undefined,s.id==='sidebar'?'ws-sidebar-preview':'');main.appendChild(content);content.append(el('h2',s.title),el('p',s.summary,'ws-summary'));
if(s.fields){const dl=el('dl',undefined,'ws-fields');s.fields.forEach(([k,v])=>dl.append(el('dt',k),el('dd',v)));content.appendChild(dl)}
if(s.rows){const table=el('table',undefined,'ws-data');const headings=s.columns||['Requirement','Status'];const thead=el('thead');const tr=el('tr');headings.forEach(c=>tr.appendChild(el('th',c)));thead.appendChild(tr);table.appendChild(thead);const tbody=el('tbody');const info=el('div',selectedRows.get(s.id)||'Select a row to inspect it.','ws-inspect');info.setAttribute('role','status');s.rows.forEach((r,i)=>{const row=el('tr');r.forEach((v,j)=>{const td=el('td');if(j===0){const b=button(v,()=>{const value=r.join(' · ');selectedRows.set(s.id,value);info.textContent=value;tbody.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))},false,'ws-row-button');b.setAttribute('aria-pressed',String(selectedRows.get(s.id)===r.join(' · ')));td.appendChild(b)}else td.textContent=v;row.appendChild(td)});tbody.appendChild(row)});table.appendChild(tbody);content.append(table,info)}
if(s.choices){const form=el('div',undefined,'ws-form');const saved=el('span',preferences.has(s.id)?'Preview selection: '+preferences.get(s.id):'Selection changes this preview only.','ws-saved-pref');s.choices.forEach((choice,i)=>{const label=el('label');const input=el('input');input.type='radio';input.name='preview-choice-'+s.id;input.checked=preferences.has(s.id)?preferences.get(s.id)===choice:i===0;input.addEventListener('change',()=>{preferences.set(s.id,choice);saved.textContent='Preview selection: '+choice});label.append(input,el('span',choice));form.appendChild(label)});form.appendChild(saved);content.appendChild(form)}
if(s.consequences){const list=el('ul',undefined,'ws-consequences');s.consequences.forEach(c=>list.appendChild(el('li',c)));content.appendChild(list)}
if(s.action){const action=el('div',undefined,'ws-action');const b=button(s.action,null,true);b.setAttribute('aria-describedby','ws-disabled-reason');action.appendChild(b);content.appendChild(action)}
const reason=el('p',s.blocked,'ws-reason');reason.id='ws-disabled-reason';content.appendChild(reason);if(s.links){const links=el('div',undefined,'ws-links');s.links.forEach(([label,id])=>links.appendChild(button(label,()=>navigate(id))));content.appendChild(links)}}
picker.addEventListener('change',()=>navigate(picker.value));root.querySelectorAll('.ws-nav [data-route]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.route)));render();
})();
