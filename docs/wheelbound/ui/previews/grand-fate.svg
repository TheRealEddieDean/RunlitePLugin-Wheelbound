no prices or gameplay approval • 2026-10-29</text><rect x="233" y="91" width="564" height="200" rx="2" fill="#2C302E" stroke="#707266"/><text x="254" y="132" font-size="21" fill="#DBB45E">Your sealed Grand Fate</text><text x="254" y="177" font-size="14" fill="#E1DDCF">Actual goal is read from the original saved seal.</text><text x="254" y="202" font-size="14" fill="#E1DDCF">Tutorial / mainland and first-run evidence gates apply.</text><text x="254" y="227" font-size="14" fill="#E1DDCF">One reroll only at the approved initial selection stage.</text><rect x="233" y="315" width="564" height="369" rx="2" fill="#2C302E" stroke="#707266"/><text x="254" y="354" font-size="18" fill="#DBB45E">Multipart goal checklist</text><text x="254" y="397" font-size="14" fill="#E1DDCF">Awakened: four separate retained boss objectives</text><text x="254" y="422" font-size="14" fill="#E1DDCF">Other goals: exact sealed objective</text><text x="254" y="447" font-size="14" fill="#E1DDCF">Master goal: obtain Ghommal’s hilt 5</text><text x="254" y="472" font-size="14" fill="#E1DDCF">Radiant: approved full-set construction</text><text x="254" y="497" font-size="14" fill="#E1DDCF"></text><text x="254" y="522" font-size="14" fill="#E1DDCF">Choose an unfinished component only when permitted.</text><text x="254" y="547" font-size="14" fill="#E1DDCF">An attempt success proposal is not a verified run win.</text><rect x="821" y="91" width="349" height="593" rx="2" fill="#2C302E" stroke="#707266"/><text x="842" y="133" font-size="19" fill="#DBB45E">GF4 PRESERVED</text><text x="842" y="180" font-size="13" fill="#E1DDCF">Muted red slices</text><text x="842" y="205" font-size="13" fill="#E1DDCF">Iron chain ring</text><text x="842" y="230" font-size="13" fill="#E1DDCF">Small skull bolts and spikes</text><text x="842" y="255" font-size="13" fill="#E1DDCF"></text><text x="842" y="280" font-size="13" fill="#E1DDCF">Original selected reference remains</text><text x="842" y="305" font-size="13" fill="#E1DDCF">in docs/wheelbound/design/.</text><text x="842" y="330" font-size="13" fill="#E1DDCF"></text><text x="842" y="355" font-size="13" fill="#E1DDCF">No new wheel artwork proposed.</text><text x="842" y="380" font-size="13" fill="#E1DDCF">No baked labels / fabricated odds.</text><text x="842" y="405" font-size="13" fill="#E1DDCF"></text><text x="842" y="430" font-size="13" fill="#E1DDCF">Original seal and receipts drive</text><text x="842" y="455" font-size="13" fill="#E1DDCF">progress; views cannot replace them.</text><rect x="841" y="604" width="308" height="32" rx="2" fill="#383A32" stroke="#707266"/><text x="853" y="625" font-size="13" fill="#DBB45E">Attempt unavailable</text></g></svg>
