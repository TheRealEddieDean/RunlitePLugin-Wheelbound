<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><g font-family="DejaVu Sans,sans-serif"><rect x="0" y="0" width="1200" height="800" rx="2" fill="#171A19" stroke="#707266"/><rect x="14" y="14" width="1172" height="772" rx="2" fill="#202322" stroke="#707266"/><text x="36" y="49" font-size="22" fill="#DBB45E">WHEELBOUND</text><text x="285" y="48" font-size="20" fill="#E1DDCF">Objective details — one shared evidence view</text><text x="940" y="47" font-size="14" fill="#B9B6A9">FP: unavailable</text><path d="M30 66L1170 66" fill="none" stroke="#707266" stroke-width="2" stroke-dasharray=""/><rect x="30" y="92" width="170" height="39" rx="2" fill="#3E3D30" stroke="#DBB45E"/><text x="43" y="117" font-size="14" fill="#DBB45E">Overview</text><rect x="30" y="143" width="170" height="39" rx="2" fill="#272B29" stroke="#50564F"/><text x="43" y="168" font-size="14" fill="#E1DDCF">Fate Tree</text><rect x="30" y="194" width="170" height="39" rx="2" fill="#272B29" stroke="#50564F"/><text x="43" y="219" font-size="14" fill="#E1DDCF">Wheel Builder</text><rect x="30" y="245" width="170" height="39" rx="2" fill="#272B29" stroke="#50564F"/><text x="43" y="270" font-size="14" fill="#E1DDCF">Shops</text><rect x="30" y="296" width="170" height="39" rx="2" fill="#272B29" stroke="#50564F"/><text x="43" y="321" font-size="14" fill="#E1DDCF">Bounties</text><rect x="30" y="347" width="170" height="39" rx="2" fill="#272B29" stroke="#50564F"/><text x="43" y="372" font-size="14" fill="#E1DDCF">Grand Fate</text><rect x="30" y="398" width="170" height="39" rx="2" fill="#272B29" stroke="#50564F"/><text x="43" y="423" font-size="14" fill="#E1DDCF">Settings / Help</text><text x="35" y="692" font-size="12" fill="#DBB45E">RUN STATUS</text><text x="35" y="717" font-size="12" fill="#B9B6A9">Not connected</text><text x="35" y="742" font-size="12" fill="#B9B6A9">Preview only</text><text x="226" y="766" font-size="12" fill="#B9B6A9">DESIGN STUDY • illustrative state • no prices or gameplay approval • 2026-10-29</text><rect x="233" y="91" width="585" height="515" rx="2" fill="#2C302E" stroke="#707266"/><text x="254" y="132" font-size="21" fill="#DBB45E">Assigned objective</text><text x="254" y="178" font-size="14" fill="#E1DDCF">Type: supplied by committed assignment</text><text x="254" y="203" font-size="14" fill="#E1DDCF">Exact source / item / skill / quest appears here.</text><text x="254" y="228" font-size="14" fill="#E1DDCF"></text><text x="254" y="253" font-size="14" fill="#E1DDCF">Progress: supported active evidence only</text><text x="254" y="278" font-size="14" fill="#E1DDCF">Paused progress is frozen.</text><text x="254" y="303" font-size="14" fill="#E1DDCF"></text><text x="254" y="328" font-size="14" fill="#E1DDCF">Restrictions and remaining tolerance</text><text x="254" y="353" font-size="14" fill="#E1DDCF">Use exact backend values, not a UI estimate.</text><text x="254" y="378" font-size="14" fill="#E1DDCF"></text><text x="254" y="403" font-size="14" fill="#E1DDCF">Already-owned items do not satisfy a fresh-drop hunt.</text><text x="254" y="428" font-size="14" fill="#E1DDCF">No withdrawal, trade or alternate unique completion.</text><rect x="254" y="542" width="250" height="32" rx="2" fill="#383A32" stroke="#707266"/><text x="266" y="563" font-size="13" fill="#DBB45E">Completion unavailable</text><rect x="842" y="91" width="328" height="515" rx="2" fill="#2C302E" stroke="#707266"/><text x="863" y="132" font-size="16" fill="#DBB45E">ACTIONS &amp; EVIDENCE</text><text x="863" y="178" font-size="13" fill="#E1DDCF">Pause / Resume when permitted</text><text x="863" y="203" font-size="13" fill="#E1DDCF"></text><text x="863" y="228" font-size="13" fill="#E1DDCF">Reject requires consequence review.</text><text x="863" y="253" font-size="13" fill="#E1DDCF">Pending settlement survives close.</text><text x="863" y="278" font-size="13" fill="#E1DDCF"></text><text x="863" y="303" font-size="13" fill="#E1DDCF">Unknown evidence ≠ complete.</text><text x="863" y="328" font-size="13" fill="#E1DDCF">Stale state → review again.</text><text x="863" y="353" font-size="13" fill="#E1DDCF">Lost acknowledgment → reconcile</text><text x="863" y="378" font-size="13" fill="#E1DDCF">the same command ID.</text><rect x="233" y="631" width="937" height="95" rx="2" fill="#2C302E" stroke="#707266"/><text x="253" y="665" font-size="13" fill="#E1DDCF">Questing: known-empty landing shows a short retry notice; retain the slice and weights.</text><text x="253" y="692" font-size="13" fill="#B9B6A9">Combat, Skilling, Slayer, KC and quests use this detail family with their own approved rules.</text></g></svg>
