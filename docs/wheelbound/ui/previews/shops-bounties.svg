" font-size="12" fill="#B9B6A9">Exact item sprite, source and reviewed reward from catalog</text><rect x="825" y="92" width="345" height="594" rx="2" fill="#2C302E" stroke="#707266"/><text x="847" y="135" font-size="18" fill="#DBB45E">ITEM GOAL → FP</text><text x="847" y="183" font-size="13" fill="#E1DDCF">Automatic qualifying active payout.</text><text x="847" y="208" font-size="13" fill="#E1DDCF">No Claim button.</text><text x="847" y="233" font-size="13" fill="#E1DDCF"></text><text x="847" y="258" font-size="13" fill="#E1DDCF">Paused: no payout or backfill.</text><text x="847" y="283" font-size="13" fill="#E1DDCF">Failure / Reject does not claw back</text><text x="847" y="308" font-size="13" fill="#E1DDCF">independent rewards already paid.</text><text x="847" y="333" font-size="13" fill="#E1DDCF"></text><text x="847" y="358" font-size="13" fill="#E1DDCF">Price unknown → unavailable.</text><text x="847" y="383" font-size="13" fill="#E1DDCF">Ownership does not prove access.</text><text x="847" y="408" font-size="13" fill="#E1DDCF"></text><text x="847" y="433" font-size="13" fill="#E1DDCF">Receipt feedback appears once,</text><text x="847" y="458" font-size="13" fill="#E1DDCF">after durable acknowledgment.</text></g></svg>
